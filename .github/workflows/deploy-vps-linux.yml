name: Deploy Xeko runner to Linux VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-xeko-vps-linux
  cancel-in-progress: false

env:
  APP_DIR: ${{ vars.XEKO_DEPLOY_DIR_LINUX || '/opt/xeko' }}
  HEALTHCHECK_URL: ${{ vars.XEKO_HEALTHCHECK_URL_LINUX || 'http://127.0.0.1:3101/health' }}

jobs:
  deploy:
    name: Deploy Xeko runner
    runs-on: [self-hosted, Linux, X64, vps-linux]
    timeout-minutes: 20

    steps:
      - name: Deploy exact commit and restart Xeko
        shell: bash
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail

          for tool in git node npm npx pm2; do
            command -v "$tool" >/dev/null 2>&1 || { echo "Missing required command: $tool"; exit 1; }
          done

          # Serialize repeated deploys of this workflow (unrelated to other apps on the shared VPS).
          lock_path="/tmp/xeko-vps-linux-deploy.lock"
          exec 9>"$lock_path"
          if ! flock -w 180 9; then
            echo "Another Xeko Linux deployment did not release the lock in time."
            exit 1
          fi

          if [ -e "$APP_DIR" ] && [ ! -d "$APP_DIR" ]; then
            echo "$APP_DIR exists but is not a directory."
            exit 1
          fi
          mkdir -p "$APP_DIR"

          if [ ! -d "$APP_DIR/.git" ]; then
            if [ -n "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
              echo "$APP_DIR is not empty and is not a Git checkout."
              exit 1
            fi
            git clone --no-checkout "$REPOSITORY_URL" "$APP_DIR"
          fi

          git -C "$APP_DIR" remote set-url origin "$REPOSITORY_URL"
          git -C "$APP_DIR" fetch --prune origin "$GITHUB_SHA"
          git -C "$APP_DIR" checkout --force --detach "$GITHUB_SHA"

          if [ ! -f "$APP_DIR/.env" ]; then
            echo "Missing $APP_DIR/.env. Create it on the VPS; never commit production secrets."
            exit 1
          fi

          npm --prefix "$APP_DIR/server" ci --omit=dev

          (cd "$APP_DIR/server" && npx playwright install chromium)

          (cd "$APP_DIR" && pm2 startOrReload ecosystem.config.js --only xeko-local --update-env)
          pm2 save

          healthy=false
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 "$HEALTHCHECK_URL" >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 3
          done
          if [ "$healthy" != "true" ]; then
            echo "Xeko health check did not return HTTP 2xx after 10 attempts."
            exit 1
          fi

          echo "Xeko deployed at commit $GITHUB_SHA"
