<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check deal sản phẩm — Xeko (test)</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f5f6f8; margin: 0; padding: 24px; color: #1c1e21; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .hint { color: #65676b; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #dadde1; border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  input[type=text] {
    width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccd0d5;
    border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  button {
    background: #1877f2; color: #fff; border: none; border-radius: 6px; padding: 9px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .engines { margin: 14px 0 0; padding: 12px; border: 1px solid #ccd0d5; border-radius: 6px; }
  .engine-options { display: flex; flex-wrap: wrap; gap: 10px; }
  .engine-options label { display: flex; align-items: center; gap: 6px; padding: 10px; background: #f5f6f8; border-radius: 6px; cursor: pointer; }
  .status { font-size: 13px; color: #65676b; margin-top: 10px; }
  .price { font-size: 22px; font-weight: 700; color: #1c1e21; margin-top: 14px; }
  .shot { margin-top: 12px; }
  .shot img { max-width: 100%; border-radius: 8px; border: 1px solid #dadde1; display: block; }
  .product-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .product-images img { width: 100%; height: 180px; object-fit: contain; }
  .product-images a { overflow-wrap: anywhere; font-size: 13px; }
  .error { color: #fa383e; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Check deal sản phẩm (test nội bộ)</h1>
  <div class="hint">Dán link 1 trang sản phẩm (Macy's, hoặc web bán lẻ tương tự) để lấy giá + ảnh sản phẩm + screenshot. Chạy thật trên VPS qua local-server.</div>
  <div class="card">
    <input type="text" id="url" placeholder="https://www.macys.com/shop/product/...">
    <input type="text" id="proxy" placeholder="(tuy chon) proxy: user:pass@host:port" style="margin-top:8px;">
    <fieldset class="engines" id="engines">
      <legend>Chọn trình duyệt</legend>
      <div class="engine-options">
        <label><input type="radio" name="engine" value="chromium" checked> Chromium</label>
        <label><input type="radio" name="engine" value="firefox"> Firefox</label>
        <label><input type="radio" name="engine" value="webkit"> WebKit</label>
      </div>
    </fieldset>
    <div class="status">Phiên bản giao diện: product-images-v2</div>
    <button id="go">Check deal</button>
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
    <div class="price" id="price"></div>
    <p id="images-status" class="status"></p>
    <div id="images" class="product-images"></div>
    <div class="shot" id="shot"></div>
    <pre class="status" id="debug" style="white-space:pre-wrap;background:#f5f6f8;padding:8px;border-radius:6px;margin-top:10px;"></pre>
  </div>
</div>
<script>
const BASE_URL = window.location.pathname.replace(/\/[^/]*$/, '').replace(/\/$/, '');

const $ = (id) => document.getElementById(id);
const btn = $('go');

function setStatus(msg) { $('status').textContent = msg || ''; }
function setError(msg) { $('error').textContent = msg || ''; }

btn.addEventListener('click', async () => {
  const url = $('url').value.trim();
  if (!url) { setError('Chưa nhập link'); return; }

  const selectedEngine = document.querySelector('input[name="engine"]:checked');
  const engine = selectedEngine.value;
  const engineLabel = selectedEngine.parentElement.textContent.trim();
  btn.disabled = true;
  $('engines').disabled = true;
  setError('');
  $('price').textContent = '';
  $('shot').innerHTML = '';
  $('images').replaceChildren();
  $('images-status').textContent = '';
  $('debug').textContent = '';
  setStatus('Đang mở trang bằng ' + engineLabel + ' và tự bấm ảnh thu nhỏ để gom ảnh sản phẩm...');

  try {
    const res = await fetch(BASE_URL + '/api/get-deal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, proxy: $('proxy').value.trim() || undefined, engine }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Lỗi không rõ');

    setStatus('Xong — trình duyệt đã chọn: ' + engineLabel + '.');
    $('price').textContent = data.price ? ('Giá đọc được: ' + data.price) : 'Không đọc được giá trên trang này.';

    const images = (Array.isArray(data.images) ? data.images : []).filter(src => {
      try { return ['http:', 'https:'].includes(new URL(src).protocol); } catch { return false; }
    });
    $('images-status').textContent = images.length
      ? 'Ảnh sản phẩm: ' + images.length + ' — bấm để mở ảnh nguồn.'
      : 'Chưa tìm thấy ảnh sản phẩm trong dữ liệu trang.';
    images.forEach((src, index) => {
      const link = document.createElement('a');
      link.href = src;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Ảnh sản phẩm ' + (index + 1);
      img.loading = 'lazy';
      img.addEventListener('error', () => {
        img.remove();
        link.append(document.createTextNode(' (không tải được bản xem trước)'));
      });
      link.append(img, document.createTextNode('Mở ảnh ' + (index + 1)));
      $('images').append(link);
    });

    if (data.debug) {
      $('debug').textContent = JSON.stringify(data.debug, null, 2);
    }

    if (data.screenshotFile) {
      const img = document.createElement('img');
      img.src = BASE_URL + '/api/get-deal-image?file=' + encodeURIComponent(data.screenshotFile);
      $('shot').append(img);
    }
  } catch (e) {
    setStatus('');
    setError('❌ ' + e.message);
  } finally {
    btn.disabled = false;
    $('engines').disabled = false;
  }
});
</script>
</body>
</html>
